<style>
/* The site stylesheet sets paragraphs to display:inline, which ran every
   story together. These rules restore one separated block per story. */
#content .story { display: block; margin-bottom: 1.5em; }
#content .story a { display: block; margin-bottom: 0.25em; }
#content .story p { display: block; margin-bottom: 0; }
#content details { display: block; margin-bottom: 1.5em; }
#content summary { margin-bottom: 0.5em; }
</style>



    <title>

        Daily News Digest

    </title>
</head>

<body>
    <div class="wrap">
        <div class="section" id="title">Daily News Digest</div>

        <div class="section" id="content">
            <p id="digest-date" style="opacity:0.8;">Loading today's digest…</p>

            <div id="tldr" style="border:1px solid rgba(255,255,255,0.35);border-radius:3px;padding:1rem 1.5rem;margin-bottom:2rem;">
                <h3 style="text-align:left;">TL;DR</h3>
                <ul id="tldr-list"></ul>
            </div>

            <div id="categories"></div>

            <p id="digest-error" style="display:none;">Today's digest is not available yet. Please check back after 8:30am Singapore time.</p>
        </div>


        <div class="section bottom-menu">
<hr />
<p>



        <a href="/posts">
                My Thoughts
            </a>



            &#183;
            <a href="/gallery">
                My Senses
            </a>

            &#183;
            <a href="/projects">
                My Works
            </a>

            &#183;
            <a href="/about">
                Me
            </a>


    &#183;
    <a href="https://howchanghong.github.io">
        main
    </a>

</p></div>



        <div class="section footer">This is Chang Hong.
<img sizes="64x64" src="https://howchanghong.github.io/logo_ch.ico" alt="Ch logo" />
</div>
    </div>

<script>
fetch('digest.json', { cache: 'no-store' })
  .then(function (response) {
    if (!response.ok) { throw new Error('digest not found'); }
    return response.json();
  })
  .then(function (data) {
    document.getElementById('digest-date').textContent =
      (data.display_date || data.date) + ' · Updated daily at 8:30am Singapore time · Only today\'s news is shown.';

    var tldrList = document.getElementById('tldr-list');
    (data.tldr || []).forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      tldrList.appendChild(li);
    });

    var container = document.getElementById('categories');
    (data.categories || []).forEach(function (category) {
      var details = document.createElement('details');
      details.open = true;
      var summary = document.createElement('summary');
      summary.textContent = category.name;
      summary.style.cursor = 'pointer';
      details.appendChild(summary);

      if (!category.stories || category.stories.length === 0) {
        var empty = document.createElement('p');
        empty.textContent = 'No news today';
        details.appendChild(empty);
      } else {
        category.stories.forEach(function (story) {
          var storyDiv = document.createElement('div');
          storyDiv.className = 'story';
          var link = document.createElement('a');
          link.href = story.url;
          link.textContent = story.title;
          storyDiv.appendChild(link);
          var p = document.createElement('p');
          p.textContent = story.summary + (story.why ? ' Why it matters: ' + story.why : '');
          storyDiv.appendChild(p);
          details.appendChild(storyDiv);
        });
      }
      container.appendChild(details);
    });
  })
  .catch(function () {
    document.getElementById('digest-date').textContent = '';
    document.getElementById('tldr').style.display = 'none';
    document.getElementById('digest-error').style.display = 'block';
  });
</script>
</body>

</html>
